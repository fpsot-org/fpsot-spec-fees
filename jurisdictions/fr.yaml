# Comparison data. The format is defined by fpsot-spec-doc (model/jurisdiction.yaml).
# Légifrance refuses automated readers, so no French code was read. The rows rest on the adopted
# text of the organic law on finance acts at the Senate, on the PayFiP page of the public finance
# directorate and on the tax stamp page of the ministry of the economy, read in an archived copy.
# France has no normative profile in this release. This file is informational and not legal advice.
code: FR
name: {en: France, fr: France}
rows:
  - id: FEE-020
    text: {en: "The State creates a charge for a service rendered by a decree in Conseil d'État, which lapses unless the next finance act ratifies it.", fr: "L’État crée une rémunération pour service rendu par un décret en Conseil d’État, qui devient caduc si la loi de finances suivante ne le ratifie pas."}
    status: stricter
    source: {title: "Loi organique relative aux lois de finances, article 4, texte adopté, Sénat", url: "https://www.senat.fr/leg/tas00-127.html", archive: "https://web.archive.org/web/20261010183037/https://www.senat.fr/leg/tas00-127.html"}
    last_checked: "2026-11-21"
  - id: FEE-047
    text: {en: "Local bodies take online payments through PayFiP, on a page that the public finance directorate runs, by card or one-off direct debit.", fr: "Les collectivités reçoivent les paiements en ligne par PayFiP, sur une page qu’exploite la Direction générale des Finances publiques, par carte ou par prélèvement unique."}
    status: same
    source: {title: "L'offre de paiement en ligne PayFiP, Direction générale des Finances publiques", date: "2026-11-21", url: "https://www.collectivites-locales.gouv.fr/gerer-les-finances-publiques-locales/moyens-de-paiement/loffre-de-paiement-en-ligne-payfip", archive: "https://web.archive.org/web/20261121171623/https://www.collectivites-locales.gouv.fr/gerer-les-finances-publiques-locales/moyens-de-paiement/loffre-de-paiement-en-ligne-payfip"}
    last_checked: "2026-11-21"
  - id: FEE-062
    text: {en: "An electronic tax stamp is valid 12 months, and an unused stamp can be refunded on request within 18 months.", fr: "Un timbre fiscal électronique est valable 12 mois, et un timbre inutilisé peut être remboursé sur demande dans un délai de 18 mois."}
    status: same
    source: {title: "Timbre fiscal, economie.gouv.fr, archived copy", date: "2025-06-21", url: "https://web.archive.org/web/20250621163939/https://www.economie.gouv.fr/particuliers/timbre-fiscal", archive: "https://web.archive.org/web/20250621163939/https://www.economie.gouv.fr/particuliers/timbre-fiscal"}
    last_checked: "2026-11-21"
