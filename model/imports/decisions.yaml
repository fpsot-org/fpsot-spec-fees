# SPDX-License-Identifier: Community-Spec-1.0
id: https://fpsot.org/model/decisions
name: decisions
title: FPSOT decision record model
description: >-
  LinkML model of the FPSOT decisions specification: the evaluation
  context and the result of the decision contract, the decision record,
  the review step, the notice record, the description of a decision type,
  the jurisdiction profile, the rule version and the dated parameter set.
  The decision record is a prov:Entity of W3C PROV-O, generated by a
  decision activity that used its inputs and followed a rule version as its
  plan; a later record may be a revision of it (prov:wasRevisionOf).
  Records hold codes, values and references, never rendered prose
  (DEC-056). Each element cites its requirement IDs.
  The model says nothing about storage (DMO-003).
  The decision record, the review step and the notice record are entities
  under DMO-021, each with its id. A slot that names a decision type, a
  profile, a rule set, a parameter set, a reason scheme or a template by
  its code and version refers to a published versioned artifact, not to an
  entity: the artifact is a released file, it never changes once released,
  and its code and version identify it. DMO-021 does not apply to such
  artifacts, and the classes that describe them (DecisionType, Profile,
  RuleVersion, ParameterSet) have no id.
version: 0.2.0
license: Community-Spec-1.0
prefixes:
  linkml: https://w3id.org/linkml/
  dat: https://fpsot.org/model/data-types/
  decisions: https://fpsot.org/model/decisions/
  prov: http://www.w3.org/ns/prov#
default_prefix: decisions
default_range: string
imports:
  - linkml:types
  # A copy of model/data-types.yaml, release v0.1.1 of the FPSOT data types specification (DMO-012).
  - imports/data-types

types:
  LanguageTag:
    typeof: string
    description: "A BCP 47 language tag, such as fr or fr-CA. LOC-001."
    pattern: "^[A-Za-z]{2,8}(-[A-Za-z0-9]{1,8})*$"
  SemanticVersion:
    typeof: string
    description: "A version number under Semantic Versioning 2.0.0, without a leading v, such as 1.2.0. DEC-012, DEC-030."
    pattern: "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"
  Sha256Digest:
    typeof: string
    description: "A SHA-256 digest of the exact bytes of an artifact, as 64 lower-case hexadecimal digits. DEC-030, DEC-048."
    pattern: "^[0-9a-f]{64}$"
  OpaqueId:
    typeof: string
    description: "An opaque identifier of a person or a workload, such as the sub claim of IAM-036. It is never a name, an email address or a number that identifies a person. IAM-091, IAM-093."
    pattern: "^\\S{1,255}$"
  FreeText:
    typeof: string
    description: "Text that a person writes, kept as written. Only the slots that DEC-054 and DEC-062 name may hold it."
    pattern: "\\S"

classes:
  Any:
    class_uri: linkml:Any
    description: "Any JSON value: a string, a number, a boolean, an object such as Money, or a list. Used only for the values of facts and parameters, whose types vary by decision type. DEC-042, DEC-052."

  DecisionContainer:
    tree_root: true
    description: >-
      A container that carries records of this model in one document, one
      list per class, such as for a bulk export or a conformance test. It is
      not an entity. DMO-014.
    attributes:
      decisionRecords: {range: DecisionRecord, multivalued: true, inlined_as_list: true, description: "Decision records. DEC-040."}
      reviewSteps: {range: ReviewStep, multivalued: true, inlined_as_list: true, description: "Review steps. DEC-062."}
      notices: {range: Notice, multivalued: true, inlined_as_list: true, description: "Notice records. DEC-056."}

  DecisionRecord:
    class_uri: prov:Entity
    description: >-
      The record of one result of the decision contract, whatever its kind.
      The record is a prov:Entity that one decision activity generated. That
      activity used the inputs, followed the rule version as its plan
      (prov:hadPlan) and had the decision service and each reviewer as agents.
      A record never changes once stored: a correction, a review, an appeal
      or a reprocessing creates a new record that names this one as its
      predecessor. DEC-040 to DEC-048.
    attributes:
      id:
        identifier: true
        range: Uuid
        description: "The identifier of the record. It equals the org.fpsot.event.id of the business event of the decision (OBS-024), the id of its CloudEvents event and the id of its seal manifest (LOG-019). New ones should be version 7 UUIDs (DAT-063). DEC-041."
      decisionType:
        range: CodeValue
        required: true
        description: "The code of the decision type, from the scheme of decision types that the deploying body names. VOC-064, DEC-010."
      decisionTypeVersion:
        range: SemanticVersion
        required: true
        description: "The version of the description of the decision type that applied. DEC-010."
      profiles:
        range: ProfileReference
        multivalued: true
        inlined_as_list: true
        required: true
        description: "Each jurisdiction profile that applied, with its version. Always holds core. DEC-011, DEC-012."
      impactLevel:
        range: CodeValue
        required: true
        description: "The impact level of the decision type under its profiles, such as level-3. DEC-013."
      objects:
        range: ObjectReference
        multivalued: true
        inlined_as_list: true
        required: true
        description: "The objects of the decision, such as the party concerned and the case, in the form of OBS-073. DEC-040."
      legalAuthorities:
        range: LegalSource
        multivalued: true
        inlined_as_list: true
        required: true
        description: "The provisions that give the power to decide. DEC-031, DEC-040."
      ruleSet:
        range: RuleSetReference
        inlined: true
        description: "The rule version that produced the result: the plan of the decision activity (prov:hadPlan). Required, except in a not-applicable result when the resolver found no rule version for the effective date and the record time. DEC-030, DEC-035, DEC-040."
      parameterSets:
        range: ParameterSetReference
        multivalued: true
        inlined_as_list: true
        description: "Each dated parameter set that the rule version read. DEC-037."
      effectiveDate:
        range: CalendarDate
        required: true
        description: "The date whose law applies to the case. It is not the date of the run. DEC-022, DEC-035."
      recordTime:
        range: Instant
        required: true
        description: "The knowledge cutoff of the run: only facts and rule versions recorded at or before this instant count. DEC-022, DEC-035."
      startedAt:
        range: Instant
        required: true
        description: "When the run started, under OBS-030. DEC-040."
      completedAt:
        range: Instant
        required: true
        description: "When the run ended, under OBS-030. DEC-040."
      inputs:
        range: InputFact
        multivalued: true
        inlined_as_list: true
        required: true
        description: "Each fact that the decision activity used (prov:used). DEC-042."
      presumptions:
        range: CodeValue
        multivalued: true
        description: "The code of each named presumption rule that supplied a fact. DEC-033."
      resultKind:
        range: ResultKind
        required: true
        description: "The kind of result. DEC-024."
      outcome:
        range: CodeValue
        description: "The outcome of a decided result, such as granted, refused or partly-granted. Required when resultKind is decided. DEC-024."
      recommendedOutcome:
        range: CodeValue
        description: "The outcome that the rule version proposed, when the service referred the case to a person under DEC-061. DEC-061."
      amount:
        range: Money
        inlined: true
        description: "The amount that a decided result grants or claims, if any. DAT-050."
      referralReason:
        range: CodeValue
        description: "Why the result went to a person, such as human-review-required, discretion or hardship. Required when resultKind is referred. DEC-026, DEC-061."
      missingFacts:
        range: CodeValue
        multivalued: true
        description: "The code of each fact that the decision needs and lacks. Required when resultKind is insufficient-information. DEC-025."
      reasonScheme:
        range: uri
        required: true
        description: "The URI of the release of the reason scheme that the reason codes come from, under VOC-036. DEC-050."
      reasons:
        range: Reason
        multivalued: true
        inlined_as_list: true
        required: true
        description: "The reasons, in order of importance. DEC-052."
      automationDegree:
        range: AutomationDegree
        required: true
        description: "How much a person took part, from the review steps that occurred. DEC-060."
      reviewStepIds:
        range: ReviewStep
        multivalued: true
        description: "The review steps that led to this record, by their id. DEC-061, DEC-062."
      predecessorId:
        range: DecisionRecord
        slot_uri: prov:wasRevisionOf
        description: "The record that this one revises. DEC-043."
      changeCause:
        range: CodeValue
        description: "Why this record revises its predecessor, such as human-review, correction, reconsideration, appeal, retroactive-law or rectified-input. Required with predecessorId. DEC-043."
      trace:
        range: TraceReference
        inlined: true
        description: "The trace of the run that the provider wrote, by reference. DEC-048."
      createdAt:
        range: Instant
        required: true
        description: "When the service stored the record. DMO-050."
      updatedAt:
        range: Instant
        required: true
        description: "Always equal to createdAt, since a record never changes (DEC-043). DMO-050."
    rules:
      - description: "A result of the kind decided, referred or insufficient-information names its rule version. Only a not-applicable result may lack one, when no rule version resolved (DEC-035)."
        preconditions:
          slot_conditions:
            resultKind:
              equals_string_in: [decided, referred, insufficient-information]
        postconditions:
          slot_conditions:
            ruleSet:
              required: true

  EvaluationContext:
    description: >-
      The evaluation context of the decision contract: which law applies and
      what the system knew. The profiles name the jurisdictions whose rules
      apply. The context is not stored on its own: the decision record copies
      its slots. DEC-020, DEC-022.
    attributes:
      effectiveDate:
        range: CalendarDate
        required: true
        description: "The date whose law applies to the case, such as the date of an application. It is not the date of the run. DEC-022, DEC-035."
      recordTime:
        range: Instant
        required: true
        description: "The knowledge cutoff: only facts and rule versions recorded at or before this instant count. DEC-022, DEC-035."
      decisionType:
        range: CodeValue
        required: true
        description: "The code of the decision type. DEC-010, DEC-022."
      profiles:
        range: ProfileReference
        multivalued: true
        inlined_as_list: true
        required: true
        description: "Each jurisdiction profile that applies, with its release. Always holds core. DEC-011, DEC-022."
      language:
        range: LanguageTag
        description: "The official language of the person, for the later notices. It never changes the result or the reasons. LOC-001, DEC-022."

  DecisionResult:
    description: >-
      The result that a rule provider returns through the decision contract,
      whatever its kind. The decision service builds a DecisionRecord from
      each DecisionResult, and adds the inputs, the context, the review steps
      and the times of the run. DEC-020, DEC-024, DEC-040.
    attributes:
      resultKind:
        range: ResultKind
        required: true
        description: "The kind of result. DEC-024."
      outcome:
        range: CodeValue
        description: "The outcome of a decided result, such as granted, refused or partly-granted. Required when resultKind is decided. DEC-024."
      amount:
        range: Money
        inlined: true
        description: "The amount that a decided result grants or claims, if any. DAT-050."
      referralReason:
        range: CodeValue
        description: "Why the result goes to a person, such as discretion or hardship. Required when resultKind is referred. DEC-026."
      missingFacts:
        range: CodeValue
        multivalued: true
        description: "The code of each fact that the decision needs and lacks. Required when resultKind is insufficient-information. DEC-025."
      recommendedOutcome:
        range: CodeValue
        description: "The outcome that the rule version proposes for a referred result, if any. DEC-026, DEC-061."
      reasons:
        range: Reason
        multivalued: true
        inlined_as_list: true
        required: true
        description: "The reasons, in order of importance. DEC-052."
      ruleSet:
        range: RuleSetReference
        inlined: true
        description: "The rule version that produced the result. Required, except in a not-applicable result when no rule version resolved. DEC-030, DEC-035."
      parameterSets:
        range: ParameterSetReference
        multivalued: true
        inlined_as_list: true
        description: "Each dated parameter set that the rule version read. DEC-037."
      presumptions:
        range: CodeValue
        multivalued: true
        description: "The code of each named presumption rule that supplied a fact. DEC-033."
      trace:
        range: TraceReference
        inlined: true
        description: "The trace of the run, by reference. DEC-048."
    rules:
      - description: "A result of the kind decided, referred or insufficient-information names its rule version. Only a not-applicable result may lack one, when no rule version resolved (DEC-035)."
        preconditions:
          slot_conditions:
            resultKind:
              equals_string_in: [decided, referred, insufficient-information]
        postconditions:
          slot_conditions:
            ruleSet:
              required: true

  ProfileReference:
    description: "A jurisdiction profile and its release. DEC-011, DEC-012."
    attributes:
      code: {range: CodeValue, required: true, description: "The code of the profile, such as core or ca-federal. DEC-011."}
      version: {range: SemanticVersion, required: true, description: "The release of the profile. DEC-012."}

  ObjectReference:
    description: "A reference to a business object, in the form of OBS-073: the class name, the internal identifier and the role of the object. OBS-073."
    attributes:
      type: {required: true, pattern: "^[A-Z][A-Za-z0-9]*$", description: "The class name, such as PartyRole or Application. DMO-020."}
      id: {required: true, pattern: "^\\S{1,255}$", description: "The internal identifier of the object. DAT-060, DAT-061."}
      qualifier: {range: CodeValue, required: true, description: "The role of the object in the decision, such as subject or case. OBS-073."}

  LegalSource:
    description: "A provision of a law, a regulation or a policy, by stable URI. DEC-031."
    attributes:
      uri: {range: uri, required: true, description: "A stable URI of the provision, down to the article or paragraph. DEC-031."}
      otherLanguageUris: {range: uri, multivalued: true, description: "The URI of the same provision in each other official language. DEC-031."}

  RuleSetReference:
    description: "The rule version that the service ran. DEC-030."
    attributes:
      code: {range: CodeValue, required: true, description: "The code of the rule set. DEC-030."}
      version: {range: SemanticVersion, required: true, description: "The rule version. DEC-030."}
      digest: {range: Sha256Digest, required: true, description: "The digest of the artifact that holds the rule version. DEC-030."}
      buildCoordinates: {required: true, pattern: "\\S", description: "The coordinates of that artifact in its repository, such as a Maven group, artifact and version. DEC-030."}

  ParameterSetReference:
    description: "A dated parameter set that the rule version read. DEC-037."
    attributes:
      code: {range: CodeValue, required: true, description: "The code of the parameter set. DEC-037."}
      version: {range: SemanticVersion, required: true, description: "The release of the parameter set. DEC-037."}
      digest: {range: Sha256Digest, required: true, description: "The digest of the parameter file. DEC-037."}

  InputFact:
    description: "One fact that the rule version used, with where it came from. DEC-042."
    attributes:
      name: {range: CodeValue, required: true, description: "The code of the fact, such as household-income. DEC-042."}
      value: {range: Any, description: "The value of the fact. Either value or reference is required. DEC-042."}
      reference: {range: uri, description: "An immutable reference to a stored copy of the value that lives as long as this record. DEC-042."}
      source: {range: CodeValue, required: true, description: "Where the fact came from, such as applicant-declaration or tax-authority. DEC-042."}
      asOfDate: {range: CalendarDate, required: true, description: "The date at which the source stated the fact. DEC-042."}
      collectionMethod: {range: CodeValue, required: true, description: "How the body got the fact, such as online-form or data-exchange. DEC-042."}

  Reason:
    description: "One reason for the result, by code and parameters, never by prose. DEC-050 to DEC-055."
    attributes:
      code: {range: CodeValue, required: true, description: "The code of a concept of the reason scheme. It names a factor. DEC-050, DEC-051."}
      rank: {range: integer, required: true, minimum_value: 1, description: "The place of the reason in order of importance, from 1. DEC-052."}
      principal: {range: boolean, required: true, description: "Whether the reason is a principal reason. DEC-052, DEC-053."}
      clause: {range: LegalSource, inlined: true, required: true, description: "The provision that the rule element applies. DEC-052."}
      actualValue: {range: Any, description: "The value of the factor for the person. DEC-052."}
      thresholdValue: {range: Any, description: "The limit or the expected value that the rule compared it with. DEC-052."}
      counterfactualRelation: {range: CodeValue, description: "How the value of the factor would have to stand against counterfactualValue for this reason not to apply: at-most, at-least, equal-to or other-than. DEC-055."}
      counterfactualValue: {range: Any, description: "The exact value at which this reason would no longer apply, with the other facts unchanged. DEC-055."}
      otherText: {range: WrittenText, multivalued: true, inlined_as_list: true, description: "For the code other only: the text that the reviewer wrote, at least once in English and once in French. Each text is a plain string with its language, kept as written, not MultilingualText, which DMO-024 keeps for published text. DEC-054, DMO-024."}

  WrittenText:
    description: "Text that a person wrote in one language, kept as written, with its language tag. DEC-054, DMO-024."
    attributes:
      language: {range: LanguageTag, required: true, description: "The language of the text. LOC-001."}
      text: {range: FreeText, required: true, description: "The text, as the person wrote it. DEC-054."}

  TraceReference:
    description: "A trace of the run that the provider keeps apart from the record. DEC-048."
    attributes:
      uri: {range: uri, required: true, description: "Where the trace is kept. DEC-048."}
      digest: {range: Sha256Digest, required: true, description: "The digest of the trace. DEC-048."}

  ReviewStep:
    class_uri: prov:Activity
    description: >-
      One action of one person on a decision record that a service showed
      them. Each step is its own record, and never changes once stored.
      DEC-060 to DEC-066.
    attributes:
      id:
        identifier: true
        range: Uuid
        description: "The identifier of the review step. DEC-062."
      decisionId:
        range: DecisionRecord
        required: true
        description: "The decision record that the service showed the reviewer. DEC-062."
      actorId:
        range: OpaqueId
        required: true
        description: "The person who acted, as the actor of IAM-091. DEC-062."
      actorRole:
        range: CodeValue
        required: true
        description: "The role of that person, as in OBS-075. DEC-062."
      representedPartyId:
        range: OpaqueId
        required: true
        description: "The party that the person acted for, such as the public body, under IAM-064. DEC-062."
      authority:
        range: CodeValue
        required: true
        description: "The code of the delegation or the power that the person held for this decision type. DEC-062."
      shownItems:
        range: CodeValue
        multivalued: true
        required: true
        description: "What the service showed the person, such as recommendation, inputs, reasons and trace. DEC-062."
      action:
        range: ReviewAction
        required: true
        description: "What the person did. DEC-062."
      agreement:
        range: boolean
        required: true
        description: "Whether the person agreed with the result that the service showed. DEC-062."
      overrideReason:
        range: CodeValue
        description: "The reason code for a change or a disagreement, from the reason scheme. Required when agreement is false. DEC-062, DEC-063."
      justification:
        range: FreeText
        required: true
        description: "Why the person acted as they did, in their own words. DEC-062."
      justificationLanguage:
        range: LanguageTag
        required: true
        description: "The language of the justification. LOC-001."
      startedAt:
        range: Instant
        required: true
        description: "When the service showed the record to the person. DEC-062."
      completedAt:
        range: Instant
        required: true
        description: "When the person acted. DEC-062."
      engagement:
        range: Engagement
        inlined: true
        description: "Evidence of how the person engaged with the record, where the privacy impact assessment allows it. DEC-065."
      createdAt:
        range: Instant
        required: true
        description: "When the service stored the step. DMO-050."
      updatedAt:
        range: Instant
        required: true
        description: "Always equal to createdAt, since a step never changes. DMO-050."

  Engagement:
    description: "What the person opened, and for how long the record was in front of them. DEC-065."
    attributes:
      inputsOpened: {range: boolean, required: true, description: "Whether the person opened the inputs. DEC-065."}
      reasonsOpened: {range: boolean, required: true, description: "Whether the person opened the reasons and the explanation. DEC-065."}
      activeDuration: {range: Duration, required: true, description: "The time during which the record was in front of the person, under DAT-021. DEC-065."}

  Notice:
    description: "The record of one notice that a body gave about a decision. The notice text itself is a sealed outbound record. A notice record never changes once stored. DEC-056, DEC-057."
    attributes:
      id: {identifier: true, range: Uuid, description: "The identifier of the notice record. DEC-056."}
      decisionId: {range: DecisionRecord, required: true, description: "The decision record that the notice communicates. DEC-056."}
      templateId: {range: CodeValue, required: true, description: "The template that rendered the text. DEC-056."}
      templateVersion: {range: SemanticVersion, required: true, description: "The release of that template. DEC-056."}
      language: {range: LanguageTag, required: true, description: "The language of the rendered text. DEC-056."}
      channel: {range: CodeValue, required: true, description: "How the body sent the notice, such as mail or online-account. DEC-056."}
      issuedAt: {range: Instant, required: true, description: "When the body issued the notice. DEC-056."}
      automationNotice: {range: boolean, required: true, description: "Whether the notice stated that automation took part in the decision. DEC-057."}
      recourseChannels: {range: RecourseChannel, multivalued: true, inlined_as_list: true, description: "Each recourse or observations channel that the notice offered, with its contact and its deadline. Absent only when the notice offered none, which the profiles allow only where recourseNotice is recommended. DEC-057."}
      sealedRecordId: {range: Uuid, required: true, description: "The id of the seal manifest of the rendered notice, under LOG-019. DEC-056."}
      createdAt: {range: Instant, required: true, description: "When the service stored the notice record. DMO-050."}
      updatedAt: {range: Instant, required: true, description: "Always equal to createdAt, since a notice record never changes. DMO-050."}

  RecourseChannel:
    description: "One recourse or observations channel that a notice offered. DEC-057."
    attributes:
      code: {range: CodeValue, required: true, description: "The code of the channel, such as reconsideration-request or observations. DEC-057."}
      contact: {range: uri, required: true, description: "Where the person uses the channel, such as a web form, a mailto: or a tel: URI. DEC-057."}
      deadline: {range: CalendarDate, description: "The last day to use the channel, when one applies. DEC-057."}

  DecisionType:
    description: "The description of one decision type, which a deploying body publishes and versions. A published versioned artifact, identified by its code and version, so it has no id under DMO-021. DEC-010 to DEC-014."
    attributes:
      code: {range: CodeValue, required: true, description: "The code of the decision type. DEC-010."}
      version: {range: SemanticVersion, required: true, description: "The release of this description. DEC-010."}
      title: {range: MultilingualText, inlined: true, required: true, description: "The name of the decision type. DAT-005."}
      profiles: {range: ProfileReference, multivalued: true, inlined_as_list: true, required: true, description: "The profiles that apply, core included. DEC-010, DEC-011."}
      impactLevel: {range: CodeValue, required: true, description: "The impact level under those profiles. DEC-013."}
      impactAssessments: {range: ImpactAssessment, multivalued: true, inlined_as_list: true, description: "Each impact assessment that a profile names. DEC-014."}
      legalAuthorities: {range: LegalSource, multivalued: true, inlined_as_list: true, required: true, description: "The provisions that give the power to decide. DEC-031."}
      reasonScheme: {range: uri, required: true, description: "The URI of the release of the reason scheme. DEC-050."}
      ruleSetCode: {range: CodeValue, required: true, description: "The code of the rule set. DEC-030."}
      humanReview: {range: boolean, required: true, description: "Whether every final result needs a review step, beyond what the profiles ask. DEC-061."}
      dualReview: {range: boolean, required: true, description: "Whether every final result needs two review steps by distinct people. DEC-064."}
      publication: {range: Publication, inlined: true, required: true, description: "Where the body publishes the rules and the general explanation. DEC-038, DEC-058."}
      reviewWindow: {range: Duration, required: true, description: "How long a decision of this type stays open to review, reconsideration or appeal, counted from the decision, under DAT-020. The rule provider keeps each rule version that a decision still open may need. DEC-034."}
      declaredScoreInputs: {range: DeclaredScoreInput, multivalued: true, inlined_as_list: true, description: "Each risk or fraud score that the entitlement rules may use as an input. Rules use no other score. DEC-028."}

  DeclaredScoreInput:
    description: "A risk or fraud score that the entitlement rules of a decision type may use as an input. DEC-028."
    attributes:
      fact: {range: CodeValue, required: true, description: "The code of the input fact that carries the score, as in InputFact.name. DEC-028, DEC-042."}
      sourceDecisionType: {range: CodeValue, required: true, description: "The decision type that produces the score, with its own records. DEC-028."}
      legalSource: {range: LegalSource, inlined: true, required: true, description: "The provision that allows the rules to use the score. DEC-028, DEC-031."}

  ImpactAssessment:
    description: "An impact assessment of a decision type. DEC-014."
    attributes:
      kind: {range: CodeValue, required: true, description: "The kind of assessment, as the profile names it. DEC-014."}
      reference: {range: uri, required: true, description: "Where the body keeps or publishes it. DEC-014."}
      completedOn: {range: CalendarDate, required: true, description: "When the body completed it. DEC-014."}

  Publication:
    description: "What a body publishes about a decision type. DEC-038, DEC-058."
    attributes:
      sourceUri: {range: uri, description: "The rule source, its tests and its citations. DEC-038."}
      explanationUri: {range: uri, description: "The general explanation. DEC-058."}
      exception: {range: CodeValue, description: "The ground for not publishing the source, such as protected-security-information. DEC-038."}

  Profile:
    description: "A jurisdiction profile: the controls that apply at each impact level. Each profile is a file in profiles/. A published versioned artifact, identified by its code and version, so it has no id under DMO-021. DEC-011, DEC-012."
    attributes:
      code: {range: CodeValue, required: true, description: "The code of the profile. DEC-011."}
      version: {range: SemanticVersion, required: true, description: "The release of the profile. DEC-012."}
      title: {range: MultilingualText, inlined: true, required: true, description: "The name of the profile. DAT-005."}
      impactAssessmentKinds: {range: CodeValue, multivalued: true, description: "The kinds of impact assessment that the profile asks for before production. DEC-014."}
      levels: {range: ProfileLevel, multivalued: true, inlined_as_list: true, required: true, description: "The controls of each impact level. DEC-013."}

  ProfileLevel:
    description: "The controls that a profile sets at one impact level. DEC-011."
    attributes:
      level: {range: CodeValue, required: true, description: "The impact level, such as level-3. DEC-013."}
      humanReview: {range: boolean, required: true, description: "Whether a final result needs a review step. DEC-061."}
      dualReview: {range: boolean, required: true, description: "Whether a final result needs two review steps by distinct people. DEC-064."}
      automationNotice: {range: NoticeControl, required: true, description: "Whether the notice must state that automation took part. DEC-057."}
      recourseNotice: {range: NoticeControl, required: true, description: "Whether the notice must give the recourse or observations channel. DEC-057."}
      allReasons: {range: boolean, required: true, description: "Whether the explanation must give every reason, not only the principal ones. DEC-053."}

  RuleVersion:
    description: "The metadata of one version of a rule set. A published versioned artifact, identified by its rule set code and version, so it has no id under DMO-021. DEC-030 to DEC-035."
    attributes:
      ruleSetCode: {range: CodeValue, required: true, description: "The code of the rule set. DEC-030."}
      version: {range: SemanticVersion, required: true, description: "The rule version. DEC-030."}
      validity: {range: DateInterval, inlined: true, required: true, description: "The dates whose cases the version decides; the end is excluded. DEC-030, DAT-023."}
      enactedAt: {range: Instant, required: true, description: "When the body adopted the version: its record time. DEC-030, DEC-035."}
      legalSources: {range: LegalSource, multivalued: true, inlined_as_list: true, required: true, description: "The provisions that the version encodes. DEC-031."}
      interpretationStatus: {range: InterpretationStatus, required: true, description: "How far legal review of the interpretation has gone. DEC-032."}
      presumptions: {range: CodeValue, multivalued: true, description: "The named presumption rules of the version. DEC-033."}
      cliffEdge: {range: boolean, required: true, description: "Whether a small change in one fact can remove the whole benefit. DEC-027."}

  ParameterSet:
    description: "A file of dated parameters, such as amounts and thresholds. A published versioned artifact, identified by its code and version, so it has no id under DMO-021. DEC-037."
    attributes:
      code: {range: CodeValue, required: true, description: "The code of the parameter set. DEC-037."}
      version: {range: SemanticVersion, required: true, description: "The release of the file. DEC-037."}
      parameters: {range: Parameter, multivalued: true, inlined_as_list: true, required: true, description: "The parameters. DEC-037."}

  Parameter:
    description: "One parameter and its value over time. DEC-037."
    attributes:
      code: {range: CodeValue, required: true, description: "The code of the parameter. DEC-037."}
      values: {range: ParameterValue, multivalued: true, inlined_as_list: true, required: true, description: "The values, one per period. DEC-037."}

  ParameterValue:
    description: "The value of a parameter over one period. DEC-037."
    attributes:
      validity: {range: DateInterval, inlined: true, required: true, description: "The dates for which the value holds. DAT-023."}
      value: {range: Any, required: true, description: "The value. DEC-037."}
      enactedAt: {range: Instant, required: true, description: "When the body adopted the value. DEC-035, DEC-037."}
      legalSource: {range: LegalSource, inlined: true, required: true, description: "The provision that sets the value. DEC-037."}

enums:
  ResultKind:
    description: "The four kinds of result of the decision contract. A profile cannot remove one. DEC-024."
    permissible_values:
      decided: {description: "The rules reached an outcome."}
      referred: {description: "A person must decide, for discretion, hardship or review."}
      insufficient-information: {description: "A fact that the rules need is missing."}
      not-applicable: {description: "The rules do not cover the case or the date."}
  AutomationDegree:
    description: "How much a person took part in the decision. DEC-060."
    permissible_values:
      fully-automated: {description: "No review step took part."}
      human-confirmed: {description: "A person reviewed the result and kept it."}
      human-decided: {description: "A person changed the result or made it."}
  ReviewAction:
    description: "What a reviewer did. DEC-062."
    permissible_values:
      confirmed: {description: "The person kept the result that the service showed."}
      changed: {description: "The person set another result."}
      referred: {description: "The person sent the case to another person."}
      returned-for-information: {description: "The person asked for a missing fact."}
  NoticeControl:
    description: "The strength of a notice control in a profile. DEC-057."
    permissible_values:
      required: {description: "Every notice must have it."}
      required-when-fully-automated: {description: "Every notice of a fully automated decision must have it."}
      recommended: {description: "Notices should have it."}
  InterpretationStatus:
    description: "How far legal review of a rule version has gone. DEC-032."
    permissible_values:
      draft: {description: "Nobody has reviewed the interpretation yet."}
      policy-reviewed: {description: "Policy experts reviewed the interpretation."}
      approved: {description: "The legal services of the body approved the interpretation."}
